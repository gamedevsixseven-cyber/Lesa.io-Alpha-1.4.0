<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="vfBg" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#2f3542"/>
      <stop offset="70%" stop-color="#14161d"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </radialGradient>
    <linearGradient id="vfBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c313d"/>
      <stop offset="50%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dff9fb"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>
  <!-- Background Badge with VF185 Magenta Accent Ring -->
  <circle cx="64" cy="64" r="59" fill="url(#vfBg)" stroke="#ff4785" stroke-width="4.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.35"/>
  <!-- Ground Motion Streak -->
  <line x1="12" y1="98" x2="116" y2="98" stroke="#ff4785" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Rear Wheel (17-inch Wide 120/70-17 with White Rim Tape, Wave Disc & Gold Caliper) -->
  <g transform="translate(31, 80)">
    <circle r="18" fill="#141519" stroke="#08090c" stroke-width="2.5"/>
    <circle r="13.5" fill="#1e222b" stroke="#f8fafc" stroke-width="1.6" stroke-dasharray="14 8"/>
    <!-- 5 Twin-Spokes -->
    <g stroke="#2f3542" stroke-width="2.4">
      <line x1="0" y1="-12" x2="0" y2="12"/><line x1="-11" y1="-4" x2="11" y2="4"/><line x1="-8" y1="9" x2="8" y2="-9"/>
    </g>
    <!-- Rear 200mm Silver Rotor & Gold Caliper -->
    <circle r="6.5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
    <path d="M2 -8 L8 -6 L7 -1 L1 -2 Z" fill="#eccc3b" stroke="#18181b" stroke-width="1"/>
    <circle r="2.2" fill="#475569"/>
  </g>

  <!-- Front Wheel (17-inch 90/80-17 with 250mm Petal Disc & Gold Caliper) -->
  <g transform="translate(97, 80)">
    <circle r="17.5" fill="#141519" stroke="#08090c" stroke-width="2.5"/>
    <circle r="13" fill="#1e222b" stroke="#f8fafc" stroke-width="1.6" stroke-dasharray="13 8"/>
    <g stroke="#2f3542" stroke-width="2.3">
      <line x1="0" y1="-11.5" x2="0" y2="11.5"/><line x1="-11" y1="4" x2="11" y2="-4"/><line x1="-8" y1="-8" x2="8" y2="8"/>
    </g>
    <!-- 250mm Wave Petal Disc & Iconic Yellow-Gold Front Caliper -->
    <circle r="7.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 1.5"/>
    <path d="M-8 -4 L-3 -9 L1 -6 L-4 0 Z" fill="#eccc3b" stroke="#18181b" stroke-width="1.1"/>
    <circle r="2.2" fill="#475569"/>
  </g>

  <!-- Chunky Matte-Black Swept Muffler & Rear Silver Passenger Footpeg Bracket -->
  <path d="M50 82 L22 70 L20 62 L54 75 Z" fill="#262930" stroke="#0c0d10" stroke-width="2" stroke-linejoin="round"/>
  <path d="M46 66 L58 63 L56 76 L44 74 Z" fill="#cbd5e1" stroke="#18181b" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Exposed Silver Radiator Core & Chrome Telescopic Front Forks + Amber Reflector -->
  <rect x="74" y="61" width="11" height="10" rx="1.5" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
  <line x1="85" y1="48" x2="97" y2="80" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="48" x2="97" y2="80" stroke="#475569" stroke-width="1.2"/>
  <circle cx="91" cy="70" r="2.2" fill="#f39c12" stroke="#18181b" stroke-width="0.8"/>

  <!-- Gloss Black Front Mudguard with Magenta ABS Dash -->
  <path d="M80 68 C87 58, 102 58, 111 66 C103 66, 90 66, 82 72 Z" fill="url(#vfBody)" stroke="#08090c" stroke-width="2"/>
  <line x1="93" y1="62" x2="101" y2="64" stroke="#ff4785" stroke-width="2" stroke-linecap="round"/>

  <!-- Underbone Main Frame & Sharp Leg-Shield Cowling -->
  <path d="M18 52 L54 48 L67 57 L84 40 L94 46 L86 74 L68 79 L54 78 L42 62 L20 60 Z" fill="url(#vfBody)" stroke="#08090c" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Sculpted Charcoal Dual Step-Through Seat -->
  <path d="M22 50 C34 45, 52 46, 61 54 L57 59 C44 55, 32 54, 21 55 Z" fill="#2d323e" stroke="#0c0d10" stroke-width="2"/>

  <!-- Exact SYM VF185 Magenta-Pink & White Side/Nose Racing Decals -->
  <path d="M68 58 L82 47 L85 52 L71 64 Z" fill="#ff4785"/>
  <path d="M70 61 L83 51 L84 54 L72 64 Z" fill="#ffffff"/>
  <path d="M77 45 L89 44 L86 48 Z" fill="#ff4785"/>

  <!-- Sharp LED Headlight Eye & Handlebar Cowl -->
  <polygon points="88,43 96,46 91,51 86,47" fill="url(#ledGlow)" stroke="#18181b" stroke-width="1"/>
  <path d="M71 34 L86 30 L90 38 L75 41 Z" fill="#2c313d" stroke="#08090c" stroke-width="2"/>
  <line x1="69" y1="36" x2="77" y2="34" stroke="#18181b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="65" y1="38" x2="71" y2="37" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- VF185 Badge Tag -->
  <rect x="33" y="21" width="62" height="15" rx="5" fill="#14161d" stroke="#ff4785" stroke-width="1.6"/>
  <text x="64" y="32" font-family="sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">SYM VF185</text>
</svg>
